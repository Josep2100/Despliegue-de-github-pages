site_name: Documentació de les meues pràctiques
site_description: Documentació de les pràctiques Implantación de Aplicacions Web
site_author: Josep Calvo

theme:
  name: material
  language: ca
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - content.code.copy

nav:
  - Inici: index.md
  - Practiques:
    - Comandos 0 - Comandos utiles: comandos.md
    - Pràctica 1 - Git i GitHub: git-github.md
    - Pràctica 2 - Introducció a Markdown: markdown.md
    - Pràctica 3 - Branques i unions: branques-unions.md
    - Pràctica 4 - MkDocs: mkdocs.md
    - Pràctica 5 - Pull Request: pull-request.md
    - Pràctica 6 - GitHub Pages: github-pages.md
    - Pràctica 7 - Instalacio de un servidor LEMP: instalacio-de-un-servidor-LEMP.md
    - Pràctica 8 - Servir multiples dominis: servir-multiples-dominis.md
    - Pràctica 9 - Web Segura: web-segura.md
    - Pràctica 10 - phpmyadmin: phpmyadmin.md

